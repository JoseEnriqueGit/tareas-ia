<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1720">
<title>Propuesta: pantallas y estados de Tareas IA</title>
<style>
  :root {
    --primary: #2563eb; --danger: #dc2626; --text: #111827; --muted: #6b7280; --border: #e5e7eb; --bg: #f9fafb;
    --surface: #fff; --medium: #f59e0b; --low: #10b981;
    --progress-bg: #dbeafe; --progress-text: #1e40af; --done-bg: #d1fae5; --done-text: #065f46;
    --error-bg: #fef2f2; --error-border: #fecaca; --error-text: #991b1b;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: var(--text);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e5e7eb; padding: 40px 44px; width: 1720px; }
  .board-title { margin: 0 0 4px; font-size: 1.5rem; }
  .board-note { margin: 0 0 28px; color: var(--text); max-width: 980px; }
  .screens { display: flex; gap: 40px; align-items: flex-start; }
  figure { margin: 0; width: 360px; }
  figcaption { font-size: .9rem; color: var(--text); margin-bottom: 10px; min-height: 84px; }
  figcaption b { display: block; color: var(--text); font-size: 1rem; margin-bottom: 2px; }

  /* Marco de teléfono: 360 x 760 CSS px */
  .phone { position: relative; width: 360px; height: 760px; background: var(--bg); border-radius: 28px; overflow: hidden;
    box-shadow: 0 4px 12px #0003; display: flex; flex-direction: column; }
  .scroll { flex: 1; overflow: hidden; padding: 0 16px 16px; }

  button, input, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Encabezado claro con saludo (RF-04) */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 12px; }
  .hello { margin: 0; font-size: 1.35rem; font-weight: 700; }
  .date { margin: 2px 0 0; color: var(--muted); font-size: .9rem; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--primary); color: #fff; font-weight: 600; font-size: .95rem; }
  .role { display: inline-block; margin-left: 6px; font-size: .7rem; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    background: var(--progress-bg); color: var(--progress-text); vertical-align: middle; }

  /* Vistas: control segmentado */
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--border); border-radius: 12px; padding: 4px; gap: 2px; }
  .seg button { min-height: 44px; border: 0; border-radius: 8px; background: transparent; font-size: .8rem; font-weight: 600; color: var(--text);
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.15; }
  .seg button[aria-selected="true"] { background: var(--surface); color: var(--text); outline: 1px solid var(--border); }
  .seg .n { font-size: .75rem; font-weight: 500; color: var(--text); }
  .seg .n.alert { color: var(--danger); font-weight: 700; }

  .searchrow { display: flex; gap: 8px; margin: 12px 0; }
  .search { flex: 1; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
  .search input { border: 0; outline: 0; background: transparent; font-size: 16px; width: 100%; color: var(--text); }
  .filterbtn { min-height: 44px; padding: 0 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface);
    display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .9rem; }
  .dot-count { min-width: 20px; height: 20px; border-radius: 999px; background: var(--primary); color: #fff; font-size: .72rem; display: grid; place-items: center; padding: 0 6px; }

  .group-title { margin: 16px 2px 6px; font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  .list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
  .list li { display: flex; align-items: center; gap: 4px; padding: 4px 12px 4px 4px; min-height: 64px; }
  .list li + li { border-top: 1px solid var(--border); }

  /* Control de estado: círculo con 44 px de área táctil, más la etiqueta escrita en la línea de meta */
  .check { width: 44px; height: 44px; flex: 0 0 44px; border: 0; background: transparent; display: grid; place-items: center; }
  .check svg { width: 26px; height: 26px; }
  .tbody { flex: 1; min-width: 0; text-decoration: none; color: inherit; padding: 8px 0; }
  .tt { display: block; font-weight: 600; font-size: 1rem; line-height: 1.3; }
  .tt.done { color: var(--muted); text-decoration: line-through; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; font-size: .82rem; color: var(--muted); align-items: center; }
  .meta .late { color: var(--danger); font-weight: 600; }
  .prio { display: inline-flex; align-items: center; gap: 4px; }
  .prio i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .prio.high { color: var(--danger); font-weight: 600; }
  .prio.high i { background: var(--danger); }
  .prio.medium i { background: var(--medium); }
  .prio.low i { background: var(--low); }
  .state { font-weight: 600; }
  .state.progress { color: var(--progress-text); }
  .who { width: 28px; height: 28px; flex: 0 0 28px; border-radius: 50%; background: var(--progress-bg); color: var(--progress-text);
    font-size: .7rem; font-weight: 700; display: grid; place-items: center; }

  .overdue { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 48px; margin-top: 12px; padding: 0 12px;
    background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 12px; color: var(--error-text); font-size: .9rem; font-weight: 600; text-decoration: none; }

  /* Botón flotante extendido */
  .fab { position: absolute; right: 16px; bottom: 84px; min-height: 56px; padding: 0 20px 0 16px; border: 0; border-radius: 999px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 12px #0003; }

  /* Barra inferior, al alcance del pulgar */
  .tabbar { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border-top: 1px solid var(--border); padding-bottom: 8px; }
  .tabbar a { min-height: 60px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none;
    color: var(--muted); font-size: .78rem; font-weight: 600; }
  .tabbar a[aria-current="page"] { color: var(--primary); }
  .tabbar svg { width: 24px; height: 24px; }

  /* Chat */
  .bar { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; }
  .bar h2 { margin: 0; font-size: 1.2rem; }
  .bar p { margin: 0; font-size: .8rem; color: var(--muted); }
  .back { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; margin-left: -10px; }
  .msgs { display: flex; flex-direction: column; gap: 10px; }
  .day { align-self: center; font-size: .75rem; color: var(--muted); }
  .b { max-width: 86%; padding: 10px 12px; border-radius: 16px; font-size: .95rem; line-height: 1.4; }
  .b.me { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
  .b.wide { width: 86%; }
  .scroll.end { display: flex; flex-direction: column; justify-content: flex-end; }
  .b.ai { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .result { margin-top: 8px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .result h3 { margin: 0; padding: 8px 10px; font-size: .82rem; background: var(--done-bg); color: var(--done-text); display: flex; align-items: center; gap: 6px; }
  .result a { display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 6px 10px; text-decoration: none; color: var(--text); }
  .result a + a { border-top: 1px solid var(--border); }
  .result a > span:first-child { flex: 1; min-width: 0; }
  .result b { display: block; font-size: .92rem; }
  .result small { color: var(--muted); font-size: .8rem; }
  .confirm { margin-top: 8px; padding: 10px; border: 1px solid var(--error-border); background: var(--error-bg); border-radius: 12px; }
  .confirm p { margin: 0 0 8px; font-size: .9rem; color: var(--error-text); }
  .btns { display: flex; gap: 8px; }
  .btn { flex: 1; min-height: 44px; border-radius: 8px; border: 0; font-weight: 700; font-size: .95rem; }
  .btn.primary { background: var(--primary); color: #fff; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ghost { background: var(--surface); border: 1px solid var(--border); }
  .chips { display: flex; gap: 8px; overflow: hidden; padding: 8px 16px 0; }
  .chip { flex: 0 0 auto; min-height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: .85rem; color: var(--text); }
  .composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px 10px; }
  .field { flex: 1; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 24px; padding: 2px 4px 2px 14px; min-height: 48px; }
  .field textarea { flex: 1; border: 0; outline: 0; resize: none; font-size: 16px; background: transparent; padding: 10px 0; height: 44px; }
  .mic { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
  .send { width: 48px; height: 48px; border: 0; border-radius: 50%; background: var(--primary); color: #fff; display: grid; place-items: center; }

  /* Formulario */
  .form { display: flex; flex-direction: column; gap: 16px; }
  .lbl { font-size: .9rem; font-weight: 600; margin-bottom: 6px; display: block; }
  .opt { color: var(--muted); font-weight: 400; }
  .inp { width: 100%; min-height: 48px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); font-size: 16px; }
  .inp.big { font-size: 1.1rem; font-weight: 600; }
  textarea.inp { min-height: 72px; resize: none; }
  .quick { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
  .quick button { min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: .85rem; font-weight: 600; }
  .quick button[aria-pressed="true"] { background: var(--progress-bg); border-color: var(--primary); color: var(--progress-text); }
  .segctl { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface); }
  .segctl button { min-height: 44px; border: 0; background: transparent; font-weight: 600; font-size: .9rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .segctl button + button { border-left: 1px solid var(--border); }
  .segctl button[aria-checked="true"] { background: var(--primary); color: #fff; }
  .segctl button[aria-checked="true"] i { box-shadow: 0 0 0 2px #fff; }
  .segctl i { width: 8px; height: 8px; border-radius: 50%; }
  .owner { display: flex; align-items: center; gap: 10px; min-height: 48px; color: var(--text); font-size: .95rem; }
  .owner .who { width: 32px; height: 32px; flex-basis: 32px; }
  .stickybar { padding: 12px 16px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 8px; }
  .stickybar .btn { min-height: 48px; }

  /* Hoja de filtros (supervisor) */
  .scrim { position: absolute; inset: 0; background: rgba(17, 24, 39, .45); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); border-radius: 20px 20px 0 0; padding: 8px 16px 14px; }
  .grab { width: 40px; height: 4px; background: var(--border); border-radius: 999px; margin: 0 auto 10px; }
  .sheet h2 { margin: 0 0 4px; font-size: 1.1rem; display: flex; justify-content: space-between; align-items: center; }
  .sheet h2 button { border: 0; background: none; color: var(--primary); font-weight: 600; font-size: .9rem; min-height: 44px; padding: 0 4px; }
  .sheet h3 { margin: 12px 0 8px; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts button { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: .88rem;
    display: inline-flex; align-items: center; gap: 6px; }
  .opts button[aria-pressed="true"] { background: var(--progress-bg); border-color: var(--primary); color: var(--progress-text); }
  .sheet .btn { width: 100%; margin-top: 16px; min-height: 48px; }

    .screens { flex-wrap: wrap; row-gap: 48px; }
  .offline { background: #fef3c7; color: #92400e; font-size: .88rem; font-weight: 600; padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
  .err { color: var(--danger); font-size: .88rem; margin-top: 6px; display: flex; gap: 6px; align-items: flex-start; }
  .inp[aria-invalid="true"] { border: 2px solid var(--danger); }
  .login { padding: 48px 24px 20px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .logo { width: 64px; height: 64px; border-radius: 16px; background: var(--primary); display: grid; place-items: center; }
  .login h1 { margin: 6px 0 0; font-size: 1.6rem; }
  .login .sub { margin: 0 0 6px; color: var(--muted); }
  .login .btn { flex: none; min-height: 48px; }
  .link { border: 0; background: none; color: var(--primary); font-weight: 600; min-height: 44px; font-size: .95rem; }
  .formalert { background: var(--error-bg); border: 1px solid var(--error-border); color: var(--error-text); border-radius: 8px; padding: 10px 12px; font-size: .9rem; }
  .empty { text-align: center; padding: 32px 8px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .empty h3 { margin: 0; font-size: 1.1rem; }
  .empty p { margin: 0; color: var(--muted); font-size: .95rem; }
  .empty .btn { flex: none; width: 100%; }
  .illu { width: 72px; height: 72px; border-radius: 50%; background: var(--progress-bg); display: grid; place-items: center; color: var(--primary); }
  .sk { background: var(--border); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .45; } }
  .skrow { display: flex; align-items: center; gap: 12px; padding: 14px 12px; }
  .skrow + .skrow { border-top: 1px solid var(--border); }
  .fab[disabled] { background: #f3f4f6; color: var(--muted); box-shadow: none; }
  .hint { font-size: .82rem; color: var(--muted); text-align: right; position: absolute; right: 16px; bottom: 146px; width: 220px; }
  .menu { list-style: none; margin: 8px 0 0; padding: 0; }
  .menu li + li { border-top: 1px solid var(--border); }
  .menu button { width: 100%; min-height: 52px; border: 0; background: none; text-align: left; font-size: 1rem; display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .menu .danger { color: var(--danger); font-weight: 600; }
  .ident { display: flex; align-items: center; gap: 12px; padding: 4px 0 12px; }
  .ident .avatar { width: 52px; height: 52px; }
  .ident b { display: block; font-size: 1.05rem; }
  .ident small { color: var(--muted); }
  .field.listening { border: 2px solid var(--danger); }
  .mic.on { background: var(--danger); color: #fff; }
  .rec { font-size: .82rem; color: var(--danger); font-weight: 600; padding: 0 16px; display: flex; gap: 6px; align-items: center; }
  .rec i { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
  .typing { display: flex; gap: 5px; padding: 14px 16px; }
  .typing i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .aierr { align-self: stretch; padding: 12px; border: 1px solid var(--error-border); background: var(--error-bg); border-radius: 12px; color: var(--error-text); font-size: .9rem; }
  .aierr p { margin: 0 0 10px; }
  .aierr .btn { flex: 1; }
  .people { list-style: none; margin: 4px 0 0; padding: 0; }
  .people li + li { border-top: 1px solid var(--border); }
  .people label { display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 1rem; }
  .people input { width: 22px; height: 22px; accent-color: var(--primary); margin: 0 4px 0 auto; }
  .people small { display: block; color: var(--muted); font-size: .8rem; }
  .sheet p.q { margin: 4px 0 12px; color: var(--muted); }
  .sheet .btns .btn { margin-top: 0; }
  .ex { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 6px; }
  .ex button { min-height: 48px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; text-align: left; padding: 8px 12px; font-size: .92rem; }
  .ft { font-size: .85rem; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<h1 class="board-title">«Al alcance del pulgar»: pantallas y estados</h1>
<p class="board-note">La misma dirección del artboard 01 aplicada al resto de la app: acceso, cuenta, todas las vistas, edición y borrado, validación, la supervisora asignando y cada estado (vacío, sin resultados, cargando, sin conexión, pensando, error de la IA, dictado).</p>
<div class="screens">

<!-- 5 Login -->
<figure><figcaption><b>5 · Iniciar sesión</b>Lo primero que ve el evaluador: marca, una frase de valor y el formulario en una columna; el registro está a un toque.</figcaption>
<div class="phone" role="img" aria-label="Iniciar sesión">
  <form class="login" onsubmit="return false">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 12.5 4 4L18 8"/></svg></div>
    <div><h1>Tareas IA</h1><p class="sub">Escribe lo que tienes pendiente y el asistente lo ordena.</p></div>
    <div><label class="lbl" for="le">Email</label><input id="le" class="inp" value="ana@prueba.com"></div>
    <div><label class="lbl" for="lp">Contraseña</label><input id="lp" class="inp" type="password" value="prueba123"></div>
    <button class="btn primary">Entrar</button>
    <div style="margin-top:auto;text-align:center" class="ft">¿No tienes cuenta? <button type="button" class="link">Regístrate</button></div>
  </form>
</div></figure>

<!-- 6 Registro con error -->
<figure><figcaption><b>6 · Crear cuenta con error</b>El nombre se pide aquí (RF-04); cada error aparece bajo su campo, y un error del servidor arriba, sin borrar lo escrito.</figcaption>
<div class="phone" role="img" aria-label="Crear cuenta con errores">
  <form class="login" onsubmit="return false" style="padding-top:28px">
    <h1 style="margin:0">Crear cuenta</h1>
    <div class="formalert" role="alert">Ese email ya está registrado. ¿Quieres iniciar sesión?</div>
    <div><label class="lbl" for="rn">Nombre</label><input id="rn" class="inp" value="Ana Pérez"></div>
    <div><label class="lbl" for="re">Email</label><input id="re" class="inp" value="ana@prueba.com"></div>
    <div><label class="lbl" for="rp">Contraseña</label><input id="rp" class="inp" type="password" value="123" aria-invalid="true" aria-describedby="rpe">
      <span class="err" id="rpe">La contraseña debe tener al menos 6 caracteres.</span></div>
    <button class="btn primary">Crear cuenta</button>
    <div style="margin-top:auto;text-align:center" class="ft">¿Ya tienes cuenta? <button type="button" class="link">Inicia sesión</button></div>
  </form>
</div></figure>

<!-- 7 Menú de cuenta -->
<figure><figcaption><b>7 · Menú de cuenta</b>El avatar abre una hoja con nombre, email y rol; «Cerrar sesión» avisa que borra los datos guardados en el teléfono.</figcaption>
<div class="phone" role="img" aria-label="Menú de cuenta">
  <header class="top"><div><h2 class="hello">Hola, Ana</h2><p class="date">Jueves 19 de noviembre</p></div><button class="avatar" aria-label="Cuenta">AP</button></header>
  <div class="scroll"><ul class="list">
    <li><button class="check" aria-label="Pendiente"><svg viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="#6b7280" stroke-width="2"/></svg></button><a class="tbody" href="#"><span class="tt">Enviar cotización a Ana</span><span class="meta"><span>Hoy</span><span class="prio high"><i></i>Alta</span></span></a></li>
  </ul></div>
  <div class="scrim" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-label="Cuenta">
    <div class="grab" aria-hidden="true"></div>
    <div class="ident"><span class="avatar" style="display:grid;place-items:center">AP</span><div><b>Ana Pérez</b><small>ana@prueba.com · Usuario</small></div></div>
    <ul class="menu">
      <li><button class="danger"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Cerrar sesión</button></li>
    </ul>
    <p class="ft" style="margin:4px 0 0">Al salir se borran las tareas guardadas para usar sin conexión.</p>
  </section>
</div></figure>

<!-- 8 Próximas -->
<figure><figcaption><b>8 · Próximas</b>Agrupadas por cuándo vencen; las tareas sin fecha van al final, como se acordó.</figcaption>
<div class="phone" role="img" aria-label="Vista Próximas">
